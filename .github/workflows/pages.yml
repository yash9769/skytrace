# Publishes the standalone birthday card (public/card.html + its images) to GitHub Pages.
name: Deploy card to GitHub Pages
on:
  push:
    branches: [main, feat/skytrace-frontend]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp public/card.html _site/index.html
          cp -r public/book public/birthday public/hearts.png _site/
          rm -f _site/book/photos/.gitkeep
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
