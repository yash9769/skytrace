<style>

<style>

/* PIN */

  const lo = Math.min(page, to), start = dir === 1 ? 0 : -180, end = dir === 1 ? -180 : 0;
  bookEl.innerHTML = `<div class="bk-full">${spread(lo+1)}</div><div class="bk-shade"></div><div class="bk-clip left">${spread(lo)}</div>
    <div class="bk-flipper" id="fl" style="transform:rotateY(${start}deg)"><div class="bk-face front">${spread(lo)}</div><div class="bk-face back">${spread(lo+1)}</div></div>`;
  paint(to);
  const fl = $("fl");
  requestAnimationFrame(() => requestAnimationFrame(() => { fl.style.transform = `rotateY(${end}deg)`; }));
  buzz(6);
  setTimeout(() => { page = to; busy = false; show(); if (to === pages.length - 1 && dir === 1) { burst(); buzz([12, 60, 12]); } }, 900);
}
bookEl.addEventListener("click", e => { const r = bookEl.getBoundingClientRect(); go(e.clientX - r.left > r.width / 2 ? 1 : -1); });
let tx = null;
bookEl.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
bookEl.addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 40) { e.preventDefault(); go(dx < 0 ? 1 : -1); } });
prev.onclick = () => go(-1); next.onclick = () => go(1);
addEventListener("keydown", e => { if (!$("bookScreen").hidden) { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); } });


// Lock the view: no pinch-zoom, double-tap zoom or panning, so nothing can leave the frame.
["gesturestart","gesturechange","gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault()));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", e => e.preventDefault());


// ---------- Family edition: scrolling page ----------
function renderScroll(d, o = {}) {
  const head = o.head !== false, ph = (src, pos) => src ? `<div class="ph"><img alt="" draggable="false" src="${src}" style="object-position:${pos || "50% 50%"}"></div>` : `<div class="ph">photo coming soon</div>`;
  const card = (c, n, extra = "") => `<article class="fam-card reveal" style="--r:${n % 2 ? .8 : -.8}deg">
      <div class="fam-photo" style="--pr:${n % 2 ? -2.5 : 2.5}deg">${ph(c.photo, c.pos)}${extra}</div>
      <div class="fam-num">${c.num}</div><h2 class="fam-title" style="font-size:${c.title.length > 26 ? 36 : 46}px">${esc(c.title)}</h2><p class="fam-text">${esc(c.text)}</p>
    </article>`;
  $("fam").innerHTML = `
    ${head ? `<header class="fam-head">
      <p class="fam-tag">★ from your family ★</p>
      <div class="fam-hero">${ph(d.cover.photo, d.cover.pos)}${stk("stars", 4)}</div>
      <div class="fam-age">${d.age}<img alt="" src="book/cupcake.png" draggable="false"></div>
      <div class="fam-greet">${d.cover.greeting.map(l => `<div>${esc(l)}</div>`).join("")}</div>
      <div class="fam-scroll">scroll down ↓</div>
    </header>` : ""}
    ${d.chapters.map((c, n) => card(c, n, stk(c.sticker, n % 2 ? 6 : -4))).join("")}
    <section class="fam-stripsec reveal">
      <div class="fam-num">${d.strip.num}</div><h2 class="fam-title">${esc(d.strip.title)}</h2>
      <div class="strip${d.strip.variable ? " var" : ""}" id="strip" aria-label="Photo strip, swipe sideways">${d.strip.frames.map(f => `<figure class="frame"${f.ar ? ` style="aspect-ratio:${f.ar}"` : ""}><img alt="" draggable="false"${f.ar ? ' loading="lazy"' : ""} src="${f.src || f}" style="object-position:${f.pos || "50% 50%"}"></figure>`).join("")}</div>
      <div class="strip-dots${d.strip.frames.length > 10 ? " count" : ""}" id="stripDots" aria-hidden="true">${d.strip.frames.length > 10 ? `<span>1 / ${d.strip.frames.length}</span>` : d.strip.frames.map(() => "<i></i>").join("")}</div>
      <p class="fam-text">${esc(d.strip.text)}</p>
      <div class="fam-swipe">swipe → </div>
    </section>
    ${card(d.solo, d.chapters.length + 1)}
    <footer class="fam-end reveal" id="famEnd"><div class="fam-sign">${esc(d.end ? d.end.caption : d.cover.caption)}</div><div class="fam-btns"><button class="bk-again" id="famTop">↑ back to the top</button>${o.book ? '<button class="bk-again" id="famBook">↺ read the book again</button>' : ""}</div></footer>`;
  $("fam").classList.toggle("nohead", !head);
  const sc = $("famScreen"); sc.scrollTop = 0;
  $("famTop").onclick = () => sc.scrollTo({ top: 0, behavior: "smooth" });
  if ($("famBook")) $("famBook").onclick = backToBook;
  const strip = $("strip"), dotEls = [...$("stripDots").children], total = strip.children.length;
  const setDot = () => {
    const r = strip.getBoundingClientRect(), mid = r.left + r.width / 2; let best = 0, bd = 1e9;
    [...strip.children].forEach((f, k) => { const b = f.getBoundingClientRect(), d = Math.abs(b.left + b.width / 2 - mid); if (d < bd) { bd = d; best = k; } });
    if (total > 10) dotEls[0].textContent = (best + 1) + " / " + total; else dotEls.forEach((e, k) => e.classList.toggle("on", k === best));
  };
  strip.addEventListener("scroll", setDot, { passive: true }); setDot();
  let done = false;
  if (!("IntersectionObserver" in window)) { sc.querySelectorAll(".reveal").forEach(e => e.classList.add("in")); return; }
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add("in"); io.unobserve(e.target);
    if (e.target.id === "famEnd" && !done) { done = true; burst(); buzz([12, 60, 12]); }
  }), { root: sc, threshold: .15 });
  sc.querySelectorAll(".reveal").forEach(e => io.observe(e));
}

// cover: fit the 640x420 stage to the viewport, open the card, then show the book
const stage = $("stage");
function fit() { const de = document.documentElement; const s = Math.min(1, (de.clientWidth - 24) / 640, (de.clientHeight - 40) / 420); $("stagebox").style.transform = `scale(${s})`; }
fit(); addEventListener("resize", fit); addEventListener("orientationchange", fit);
stage.onclick = () => {
  if (stage.classList.contains("opened")) return;
  stage.classList.add("opened"); buzz(10);
  $("card").classList.add("open");
  setTimeout(() => { $("cover").classList.add("fade"); }, 450);
  setTimeout(() => { $("cover").hidden = true; if (mode === "family") { $("famScreen").hidden = false; renderScroll(familyData); enter($("famScreen")); } else { $("bookScreen").hidden = false; show(); enter($("bookScreen")); } }, 1050);
};

// ---------- PIN gate ----------
// PIN -> which version opens. Change the numbers here. NOTE: this is client-side, so it is a
// door, not a vault: anyone who views the page source can read these.
const PINS = { "123": "mansi", "456": "family" };
const PIN_MAX = 6;
let entry = "";
const pinDots = $("pinDots"), pinMsg = $("pinMsg"), pinCard = document.querySelector(".pin-card");
function drawPin() { pinDots.innerHTML = Array.from({ length: Math.max(3, entry.length) }, (_, i) => `<i class="${i < entry.length ? "on" : ""}"></i>`).join(""); }
let unlocking = false;
function unlock(mode) {
  unlocking = true; setMode(mode); preload(data); buzz([10, 50, 18]);
  pinCard.classList.add("ok"); pinMsg.textContent = mode === "family" ? "welcome ♡" : "welcome, birthday girl ♡";
  setTimeout(() => { $("pinScreen").classList.add("fade"); }, 650);
  setTimeout(() => { $("pinScreen").hidden = true; $("cover").hidden = false; $("homeBtn").hidden = false; fit(); enter($("cover")); }, 1150);
}
function pinKey(k) {
  if (unlocking) return;
  buzz(k === "go" ? 0 : 8);
  if (k === "del") entry = entry.slice(0, -1);
  else if (k === "go") {
    const mode = PINS[entry];
    if (mode) { drawPin(); unlock(mode); return; }
    pinMsg.textContent = entry ? "That PIN isn't right. Try again." : "Enter your PIN first.";
    pinCard.classList.remove("shake"); void pinCard.offsetWidth; pinCard.classList.add("shake"); buzz([30, 40, 30]);
    entry = "";
  } else if (entry.length < PIN_MAX) { entry += k; pinMsg.innerHTML = "&nbsp;"; if (PINS[entry]) { drawPin(); unlock(PINS[entry]); return; } }
  drawPin();
}
$("pinPad").innerHTML = ["1","2","3","4","5","6","7","8","9","del","0","go"].map(k => `<button class="pin-key${k === "go" ? " go" : ""}" data-k="${k}" aria-label="${k === "del" ? "Delete" : k === "go" ? "Open" : k}">${k === "del" ? "⌫" : k === "go" ? "✓" : k}</button>`).join("");
$("pinPad").addEventListener("click", e => { const b = e.target.closest("button"); if (b) pinKey(b.dataset.k); });
addEventListener("keydown", e => { if ($("pinScreen").hidden) return; if (/^[0-9]$/.test(e.key)) pinKey(e.key); else if (e.key === "Backspace") pinKey("del"); else if (e.key === "Enter") pinKey("go"); });

// ---------- Home: back to the PIN screen (enter the other PIN to switch version) ----------
function goHome() {
  buzz(8);
  document.querySelectorAll(".burst").forEach(e => e.remove());
  ["cover", "bookScreen", "famScreen"].forEach(id => { $(id).hidden = true; $(id).classList.remove("fade", "enter"); });
  stage.classList.remove("opened"); $("card").classList.remove("open");
  $("famScreen").scrollTop = 0; busy = false; page = 0;
  setMode("mansi");
  entry = ""; unlocking = false; drawPin();
  pinCard.classList.remove("ok", "shake"); pinMsg.innerHTML = "&nbsp;";
  $("pinScreen").classList.remove("fade"); $("pinScreen").hidden = false; enter($("pinScreen"));
  $("homeBtn").hidden = true;
}
$("homeBtn").addEventListener("click", goHome);
drawPin(); enter($("pinScreen"));
</script>
</body></html>
